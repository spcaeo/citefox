name: Download page

# Deploys site/ (the download page, docs and glossary) to GitHub Pages. The page reads the latest
# release from the GitHub API in the browser, so a new release needs no
# redeploy. One-time setup: Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Docs/help/**'
      - 'media/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Rebuilds the pages from Docs/help and copies the screenshots in media
      # to site/media (scripts/site/build-site.mjs; no npm install needed).
      - run: node scripts/site/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
