name: Download page

# Deploys site/ (the download page, docs, glossary, the live demo and the sample
# reports) to GitHub Pages. The page reads the latest
# release from the GitHub API in the browser, so a new release needs no
# redeploy. One-time setup: Settings › Pages › Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Docs/help/**'
      - 'media/**'
      - 'scripts/site/**'
      - 'scripts/demo/**'
      - 'src/**'
      - 'tests/demo/**'
      - 'tests/e2e/reports-seed.ts'
      - 'vite.demo.config.ts'
      - 'vitest.demo.config.mts'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The demo and the sample reports need the app's packages (not Electron itself).
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Docs/DEMO.md: the live demo (site/demo, from the recorded snapshot), the
      # sample reports (site/samples/*/, the app's offline HTML download on the demo
      # project), then the pages from Docs/help and the screenshots in media.
      - run: npm run site:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
