name: Release

# A `v*` tag (made by `npm run release`, Docs/RELEASING.md) builds every
# installer and puts them on a DRAFT GitHub Release with SHA256SUMS.txt and the
# CHANGELOG section as notes. A tag with a hyphen (v1.3.0-beta.1) becomes a
# prerelease. Publishing the draft stays a person's click.
#
# One runner per OS. Each also packages the other arch: it first adds that
# arch's @napi-rs/keyring binary (scripts/add-native-arch.mjs, checked against
# package-lock.json); better-sqlite3 ships every prebuild.
#
# Signing and notarization turn on only when the secrets below exist; without
# them the Mac app is ad-hoc signed and the Windows installer unsigned.
on:
  push:
    tags: ['v*']
  # A manual run builds the installers as workflow artifacts, no release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check tag and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Tag matches package.json and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release.ts notes "$GITHUB_REF_NAME" > /dev/null

  package:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple chip runner: universal + arm64 + x64 dmg, universal zip.
          - name: macos
            os: macos-latest
            extra-arch: darwin x64
            runs: --mac
          # Windows x64 runner: arm64 first so the x64 run writes latest.yml last.
          - name: windows
            os: windows-latest
            extra-arch: win32 arm64
            runs: --win --arm64;--win --x64
          - name: linux
            os: ubuntu-latest
            extra-arch: linux arm64
            runs: --linux --x64 --arm64
    steps:
      # Full history: the build number is the commit count (scripts/build-number.ts).
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count (scripts/build-number.ts): a
          # shallow clone would stamp "build 1".
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Add the other arch's native binary
        run: node scripts/add-native-arch.mjs ${{ matrix.extra-arch }}

      - name: Build
        run: npm run build
        env:
          # Join CiteFox and the daily ping go to the owner's Apps Script web app
          # (server/README.md). Repository variables; unset builds send nothing.
          CITEFOX_REGISTER_URL: ${{ vars.CITEFOX_REGISTER_URL }}
          CITEFOX_REGISTER_TOKEN: ${{ vars.CITEFOX_REGISTER_TOKEN }}

      # electron-builder wants APPLE_API_KEY as a path to the .p8 file.
      - name: Prepare notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: |
          IFS=';' read -ra runs <<< "${{ matrix.runs }}"
          for args in "${runs[@]}"; do
            echo "::group::electron-builder $args"
            npx electron-builder --config electron-builder.config.ts $args --publish never
            echo "::endgroup::"
          done
          ls -la release
        env:
          # macOS: Developer ID Application certificate (base64 .p12) and password.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # macOS notarization: App Store Connect API key (preferred; the
          # key file comes from the step above) ...
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # ... or an Apple ID with an app-specific password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: code-signing certificate (base64 .pfx) and password.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: citefox-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          node scripts/checksums.mjs dist
          cat dist/SHA256SUMS.txt
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release.ts notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run: replace the files and notes on the existing release.
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/notes.md" $prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft $prerelease \
              --title "CiteFox $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
