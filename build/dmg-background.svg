<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <!-- CiteFox installer window (the .dmg), 660x400 pt. The app icon sits at (180,200) and the
       Applications shortcut at (480,200) (electron-builder.config.ts, dmg.contents), so the
       arrow runs between them. Colours come from src/renderer/src/styles/tokens.css:
       ink #202020, ink-3 #646464, ink-4 #8d8d8d, brand #c2410c. Render: npm run dmg:background -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f1ed"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#ground)"/>
  <text x="330" y="62" text-anchor="middle" fill="#202020" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="650" letter-spacing="-0.3">Install CiteFox</text>
  <text x="330" y="90" text-anchor="middle" fill="#646464" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14.5">Drag the fox into your Applications folder</text>
  <!-- arrow between the two icons -->
  <g fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 190 C 300 176, 344 176, 388 190" stroke-dasharray="1 11"/>
    <path d="M372 172 L 400 191 L 372 210"/>
  </g>
  <text x="330" y="352" text-anchor="middle" fill="#8d8d8d" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5">Then open CiteFox from Launchpad or your Applications folder.</text>
</svg>
